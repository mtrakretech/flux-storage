name: Draft package (unreleased)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: python -m pip install -r requirements-dev.txt pyinstaller==6.17.0
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run build
        working-directory: frontend
      - run: python -m unittest discover -s tests -v
      - run: python tools/audit_public.py --tracked
      - name: Build draft bundled-runtime distribution
        run: python -m PyInstaller --noconfirm packaging/flux.spec
      - name: Archive and checksum draft
        shell: pwsh
        run: |
          Compress-Archive -Path dist/FluxStorage -DestinationPath dist/FluxStorage-windows-x64-DRAFT.zip
          $hash = Get-FileHash dist/FluxStorage-windows-x64-DRAFT.zip -Algorithm SHA256
          "$($hash.Hash.ToLower())  FluxStorage-windows-x64-DRAFT.zip" | Out-File dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: FluxStorage-windows-x64-DRAFT-unreleased
          path: |
            dist/FluxStorage-windows-x64-DRAFT.zip
            dist/SHA256SUMS.txt
          retention-days: 14
